 <!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Reserva - Estacionamento</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Cadastro de Reserva</h1>
  <form id="formCadastro">
    <label>Placa do veículo: <input type="text" id="placa" required></label><br>
    <label>Nome do proprietário: <input type="text" id="proprietario" required></label><br>
    <label>Número do apartamento: <input type="number" id="apartamento" required></label><br>
    <label>Bloco do apartamento: <input type="text" id="bloco" required></label><br>
    <label>Modelo do veículo: <input type="text" id="modelo" required></label><br>
    <label>Cor do veículo: <input type="text" id="cor" required></label><br>
    <label>Número da vaga: <input type="number" id="vaga" required></label><br>
    <button type="submit">Salvar</button>
  </form>

  <script src="script.js"></script>
</body>
</html>
